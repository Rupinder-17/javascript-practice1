<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="w-72 h-56 m-auto bg-slate-400 px-5 py-7">
      <div>
        <input type="text" id="taskInput" />
        <button id="addButton" class="bg-slate-50">Add</button>
        <p class="hidden text-red-700 mt-1" id="ptag">
          Enter more than 3 characters
        </p>
      </div>
      <div>
        <ul id="userList"></ul>
      </div>
    </div>
    <script>
      const inputData = document.getElementById("taskInput");
      const addButton = document.getElementById("addButton");
      const userList = document.getElementById("userList");
      const ptag = document.getElementById("ptag");
      let taskArr = JSON.parse(localStorage.getItem("inputItems")) || [];
      inputData.addEventListener("input", validInput);
      addButton.addEventListener("click", addTask);

      function validInput() {
        let inputValue = inputData.value.trim();
        if (inputValue.length < 3) {
          ptag.classList.remove("hidden");
        } else {
          ptag.classList.add("hidden");
        }
      }

      function addTask() {
        let inputValue = inputData.value.trim();
        if (inputValue.length < 3) {
          return;
        }

        const taskobj = {
          id: window.crypto.randomUUID(),
          taskName: inputValue,
          taskStatus: false,
        };
        taskArr.push(taskobj);
        displayTask();
        storeData();
        inputData.value = "";
        ptag.classList.add("hidden");
      }

      function storeData() {
        localStorage.setItem("inputItems", JSON.stringify(taskArr));
      }

      function displayTask() {
        userList.innerHTML = "";
        taskArr.forEach((items) => {
          let listItem = `<li class='flex'>
                <p class="w-full">${items.taskName}</p>
                <button class="delButton" data-id="${items.id}">Del</button>
                <button class="EditButton" data-id="${items.id}">Edit</button>
                <button class="saveButton hidden" data-id="${items.id}">Save</button>
              </li>`;
          userList.innerHTML += listItem;
        });

        const delButton = document.querySelectorAll(".delButton");
        const editButton = document.querySelectorAll(".EditButton");
        const saveButton = document.querySelectorAll(".saveButton");

        delButton.forEach((element) => {
          element.addEventListener("click", function () {
            const delId = element.getAttribute("data-id");
            taskArr = taskArr.filter((item) => item.id !== delId);
            displayTask();
            storeData();
          });
        });

        editButton.forEach((elm) => {
          elm.addEventListener("click", function () {
            const li = elm.parentElement;
            const pTag = li.querySelector("p");
            const inputField = document.createElement("input");
            const editWarning = document.createElement("span");

            editWarning.innerText = "Enter more than 7 characters";
            editWarning.classList.add("hidden", "text-red-700", "mt-1");

            inputField.value = pTag.innerHTML;
            inputField.classList.add("w-full", "ring-1");
            li.replaceChild(inputField, pTag);
            li.appendChild(editWarning);

            toggleButtons(li, true);

            inputField.addEventListener("input", function () {
              if (inputField.value.trim().length < 7) {
                editWarning.classList.remove("hidden");
              } else {
                editWarning.classList.add("hidden");
              }
            });
          });
        });

        saveButton.forEach((saveItem) => {
          saveItem.addEventListener("click", function () {
            const li = saveItem.parentElement;
            const inputField = li.querySelector("input");
            const editWarning = li.querySelector("span");

            if (inputField.value.trim().length < 7) {
              editWarning.classList.remove("hidden");
              return;
            }

            const saveItemId = saveItem.getAttribute("data-id");
            taskArr = taskArr.map((item) =>
              item.id === saveItemId ? { ...item, taskName: inputField.value } : item
            );

            displayTask();
            storeData();
          });
        });
      }

      function toggleButtons(li, isEditing) {
        const delBtn = li.querySelector(".delButton");
        const editBtn = li.querySelector(".EditButton");
        const saveBtn = li.querySelector(".saveButton");

        delBtn.classList.toggle("hidden", isEditing);
        editBtn.classList.toggle("hidden", isEditing);
        saveBtn.classList.toggle("hidden", !isEditing);
      }

      displayTask();
    </script>
  </body>
</html>
