<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 flex items-center justify-center p-4 font-sans">
    <div class="max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">
      <div class="p-6 text-center">
        <h1 class="text-3xl font-bold">Pomodoro Timer</h1>
      </div>

      <div class="flex border-b">
        <button
          id="focus"
          class="flex-1 py-3 px-4 text-center font-medium bg-black text-white transition-all rounded-t-lg"
        >
          Focus
        </button>
        <button
          id="break"
          class="flex-1 py-3 px-4 text-center font-medium bg-gray-300 text-white transition-all rounded-t-lg"
        >
          Break
        </button>
      </div>

      <div class="p-8 flex flex-col items-center">
        <div
          class="text-6xl font-bold text-gray-800 tabular-nums mb-8"
          id="time"
        >
          30:00
        </div>

        <div class="flex space-x-4">
          <button
            id="start"
            class="px-6 py-2 bg-black text-white font-medium rounded-full transition-all shadow-md"
          >
            Start
          </button>
          <button
            id="reset"
            class="px-6 py-2 bg-gray-300 text-gray-700 font-medium rounded-full hover:bg-gray-400 transition-all shadow-md"
          >
            Reset
          </button>
        </div>
      </div>

      <div class="bg-gray-50 p-6 grid grid-cols-2 gap-6">
        <div class="flex flex-col items-center">
          <h3
            class="text-sm font-semibold text-gray-600 uppercase tracking-wide mb-2"
          >
            Focus Time
          </h3>
          <div class="flex items-center space-x-3">
            <button
              id="minus"
              class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center hover:bg-gray-400 transition-all"
            >
              <span class="text-gray-700 text-xl font-bold">-</span>
            </button>
            <span
              id="focus-time"
              class="text-xl font-semibold text-gray-800 w-14 text-center"
              >30m</span
            >
            <button
              id="plus"
              class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center hover:bg-gray-400 transition-all"
            >
              <span class="text-gray-700 text-xl font-bold">+</span>
            </button>
          </div>
        </div>

        <div class="flex flex-col items-center">
          <h3
            class="text-sm font-semibold text-gray-600 uppercase tracking-wide mb-2"
          >
            Break Time
          </h3>
          <div class="flex items-center space-x-3">
            <button
              id="breakminus"
              class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center hover:bg-gray-400 transition-all"
            >
              <span class="text-gray-700 text-xl font-bold">-</span>
            </button>
            <span
              id="breakTime"
              class="text-xl font-semibold text-gray-800 w-14 text-center"
              >5m</span
            >
            <button
              id="breakplus"
              class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center hover:bg-gray-400 transition-all"
            >
              <span class="text-gray-700 text-xl font-bold">+</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <script>
      const focuss = document.getElementById("focus");
      const Break = document.getElementById("break");
      const displayTime = document.getElementById("time");
      const start = document.getElementById("start");
      const reset = document.getElementById("reset");
      const decrementButton = document.getElementById("minus");
      const incrementButton = document.getElementById("plus");
      const focusTimeDisplay = document.getElementById("focus-time");
      const breakDecrement = document.getElementById("breakminus");
      const breakTimeDisplay = document.getElementById("breakTime");
      const breakIncrement = document.getElementById("breakplus");
      let mode = "focus";
      let interval;
      let BreakTime = 5;
      let FocusTime = 30;
      let time = FocusTime * 60;
      console.log("time", time);

      function updateTimer() {
        const minutes = Math.floor(time / 60)
          .toString()
          .padStart(2, "0");
        const seconds = (time % 60).toString().padStart(2, "0");
        displayTime.textContent = `${minutes}:${seconds}`;
      }
      function focusOnTask() {
        console.log("focus");
        mode = "focus";
        time = FocusTime * 60;
        focuss.classList.add("bg-black", "text-white");
        focuss.classList.remove("bg-gray-300");
        Break.classList.remove("bg-black", "text-white");
        Break.classList.add("bg-gray-300", "text-white");
      }
      focuss.addEventListener("click", focusOnTask);

      function takeBreak() {
        console.log("break");
        mode = "break";
        time = BreakTime * 60;
        Break.classList.add("bg-black", "text-white");
        Break.classList.remove("bg-gray-300");
        focuss.classList.remove("bg-black");
        focuss.classList.add("bg-gray-300", "text-white");
      }
      Break.addEventListener("click", takeBreak);

      function startTask() {
        console.log("start");
        if (!interval) {
          interval = setInterval(() => {
            if (time > 0) {
              time--;
              updateTimer();
            } else {
              clearInterval(interval);
              interval = null;
            }
          }, 1000);
        }
      }
      start.addEventListener("click", startTask);

      function resetTask() {
        console.log("reset");
        clearInterval(interval);
        interval = null;
        if (mode == "focus") {
          time = FocusTime * 60;
        } else {
          time = BreakTime * 60;
        }
        updateTimer();
      }

      reset.addEventListener("click", resetTask);

      function decrementFocusTime() {
        console.log("decrement");
        if (FocusTime > 1) {
          FocusTime--;
          focusTimeDisplay.textContent = `${FocusTime}m`;
          if (mode === "focus") {
            time = FocusTime * 60;
            updateTimer();
          }
        }
      }
      decrementButton.addEventListener("click", decrementFocusTime);

      function incrementFocusButton() {
        console.log("increment");
        if (FocusTime < 30) {
          FocusTime++;
          focusTimeDisplay.textContent = `${FocusTime}m`;
          if (mode === "focus") {
            time = FocusTime * 60;
            updateTimer();
          }
        }
      }
      incrementButton.addEventListener("click", incrementFocusButton);

      function breakDecrementTime() {
        console.log("breakdecrement");
        if (BreakTime > 1) {
          BreakTime--;
          breakTimeDisplay.textContent = `${BreakTime}m`;
          if (mode === "break") {
            time = BreakTime * 60;
            updateTimer();
          }
        }
      }
      breakDecrement.addEventListener("click", breakDecrementTime);

      function breakIncrementTime() {
        console.log("breakIncrement");
        if (BreakTime < 5) {
          BreakTime++;
          breakTimeDisplay.textContent = `${BreakTime}m`;
          if (mode === "break") {
            time = BreakTime * 60;
            updateTimer();
          }
        }
      }
      breakIncrement.addEventListener("click", breakIncrementTime);
    </script>
  </body>
</html>
