<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">
    
    <!-- Header -->
    <div class="bg-blue-600 text-white p-6 text-center">
      <h1 class="text-3xl font-bold">Pomodoro Timer</h1>
    </div>

    <!-- Mode Selection -->
    <div class="flex border-b">
      <button id="focus-btn" class="flex-1 py-3 px-4 text-center font-medium bg-blue-600 text-white transition-all rounded-t-lg">
        Focus
      </button>
      <button id="break-btn" class="flex-1 py-3 px-4 text-center font-medium bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all rounded-t-lg">
        Break
      </button>
    </div>

    <!-- Timer Display -->
    <div class="p-8 flex flex-col items-center">
      <div class="text-6xl font-bold text-gray-800 tabular-nums mb-8" id="timer">30:00</div>

      <!-- Timer Controls -->
      <div class="flex space-x-4">
        <button id="start-btn" class="px-6 py-2 bg-blue-600 text-white font-medium rounded-full hover:bg-blue-700 transition-all shadow-md">
          Start
        </button>
        <button id="reset-btn" class="px-6 py-2 bg-gray-300 text-gray-700 font-medium rounded-full hover:bg-gray-400 transition-all shadow-md">
          Reset
        </button>
      </div>
    </div>

    <!-- Time Settings -->
    <div class="bg-gray-50 p-6 grid grid-cols-2 gap-6">
      
      <!-- Focus Time -->
      <div class="flex flex-col items-center">
        <h3 class="text-sm font-semibold text-gray-600 uppercase tracking-wide mb-2">Focus Time</h3>
        <div class="flex items-center space-x-3">
          <button id="focus-minus" class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center hover:bg-gray-400 transition-all">
            <span class="text-gray-700 text-xl font-bold">-</span>
          </button>
          <span id="focus-time" class="text-xl font-semibold text-gray-800 w-14 text-center">30m</span>
          <button id="focus-plus" class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center hover:bg-gray-400 transition-all">
            <span class="text-gray-700 text-xl font-bold">+</span>
          </button>
        </div>
      </div>

      <!-- Break Time -->
      <div class="flex flex-col items-center">
        <h3 class="text-sm font-semibold text-gray-600 uppercase tracking-wide mb-2">Break Time</h3>
        <div class="flex items-center space-x-3">
          <button id="break-minus" class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center hover:bg-gray-400 transition-all">
            <span class="text-gray-700 text-xl font-bold">-</span>
          </button>
          <span id="break-time" class="text-xl font-semibold text-gray-800 w-14 text-center">5m</span>
          <button id="break-plus" class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center hover:bg-gray-400 transition-all">
            <span class="text-gray-700 text-xl font-bold">+</span>
          </button>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
