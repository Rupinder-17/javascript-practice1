<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-100">
    <div class="w-[400px] h-auto bg-white m-auto mt-10 shadow-md rounded-md">
      <h1 class="text-center text-2xl font-bold py-4 text-black">
        Promodoro Timer
      </h1>
      <div class="flex justify-center gap-4">
        <button class="text-xl bg-black text-white rounded-md px-4 py-1">
          Focus
        </button>
        <button
          class="text-xl py-1 px-4 bg-white border border-gray-100 rounded-md text-black"
        >
          Break
        </button>
      </div>
      <div class="flex justify-center py-8 text-4xl font-bold">
        <span>30</span>
        <span>:</span>
        <span>00</span>
      </div>

      <div class="flex justify-between px-8">
        <div class="flex flex-col justify-center items-center">
          <h1 class="mb-2 font-semibold">Focus Time</h1>
          <div class="flex gap-2">
            <button id="decrement"
              class="py-0 px-2 bg-white border border-gray-200 rounded-md text-black"
            >
              -
            </button>
            <span class="font-semibold">30m</span>
            <button id="increment"
              class="py-0 px-2 bg-white border border-gray-200 rounded-md text-black"
            >
              +
            </button>
          </div>
        </div>
        <div class="flex flex-col justify-center items-center">
          <h1 class="mb-2 font-semibold">Break Time</h1>
          <div class="flex gap-2">
            <button id="breakdecrement"
              class="py-0 px-2 bg-white border border-gray-200 rounded-md text-black"
            >
              -
            </button>
            <span id="time" class="font-semibold">5m</span>
            <button id="Breakincrement"
              class="py-0 px-2 bg-white border border-gray-200 rounded-md text-black"
            >
              +
            </button>
          </div>
        </div>
      </div>
      <div class="flex justify-center gap-4 py-8">
        <button id="start" class=" flex items-center gap-2 bg-black px-6 py-2 text-white rounded-md">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-play"
          >
            <polygon points="6 3 20 12 6 21 6 3" /></svg
          ><span>Start</span></button>
        </button>
        <button id="reset" class="border flex items-center gap-2 px-6 py-2 border-gray-200 rounded-md">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            <span>Reset</span>
        </button>
      </div>
    </div>
    <script>
       const  fincrement = document.getElementById("increment");
       const  fdecrement = document.getElementById("decrement");
       const  bincrement = document.getElementById("breakdecrement");
       const  bdecrement = document.getElementById("Breakincrement");
       const  start = document.getElementById("start");
       const  reset = document.getElementById("reset");
       const time = document.getElementById("time");
       fdecrement.addEventListener("click",()=>{
        let ntime = time.value;
        console.log("ntime")
        console.log("click")
       })
    </script>
  </body>
</html>
